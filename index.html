<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexus Sport Concept AR</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin:0; height:100%; }
    model-viewer { width:100%; height:100%; background:#222; }
  </style>
</head>
<body>
  <model-viewer
    src="Lexus Sport ConceptAR.glb"
    ios-src="Lexus Sport ConceptAR.usdz"
    alt="自作の車"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral">
    <button slot="ar-button"
      style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 24px;font-size:18px;border-radius:30px;border:0;">
      ARで召喚する
    </button>
  </model-viewer>
</body>
</html>
